name: Publish release summary

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Palabre release tag (for example v0.15.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Bluesky summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an existing vX.Y.Z release tag."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Publish release summary to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$BLUESKY_HANDLE" ] || [ -z "$BLUESKY_APP_PASSWORD" ]; then
            echo "::error::Bluesky secrets are not configured."
            exit 1
          fi
          node scripts/post_release_bluesky.mjs --tag "$RELEASE_TAG"
